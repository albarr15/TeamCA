server {
    listen 4321;

    root /usr/share/nginx/html;
    index index.html;

    # Astro's hashed JS/CSS files must never fall back to the app shell. After
    # a rebuild, an old browser tab can request a removed hash; serving
    # index.html there produces a strict MIME-type error and breaks navigation.
    # A browser can retain an HTML document from the previous Docker build.
    # If it then asks for that document's removed CSS hash, return harmless CSS
    # so the page can finish loading and fetch the current document.
    location ~ ^/_astro/.*\.css$ {
        try_files $uri /_astro/stale.css;
        add_header Cache-Control "no-cache";
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Keep HTML routes fresh so they reference the current hashed assets.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
